<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hushlight — a top-down stealth game</title>
<style>
  html, body { margin: 0; padding: 0; background: #07090f; min-height: 100%; }
  body {
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; font-family: system-ui, sans-serif;
  }
  main { text-align: center; padding: 16px; }
  canvas {
    width: min(960px, 96vw); height: auto; display: block; margin: 0 auto;
    background: #11151f; border: 1px solid #26304a; border-radius: 6px;
    box-shadow: 0 18px 60px rgba(0, 0, 0, 0.6);
  }
  p.hint { color: #8d97ad; font-size: 13px; margin: 12px 0 0; }
  p.hint b { color: #ffd489; font-weight: 600; }
</style>
</head>
<body>
<main>
  <canvas id="game" width="960" height="600"></canvas>
  <p class="hint"><b>Hushlight</b> — WASD / arrows to move, hold <b>Shift</b> to sneak, <b>E</b> to toss a coin, <b>P</b> to pause, <b>R</b> to restart the level.</p>
</main>
<script src="src/levels.js"></script>
<script src="src/geometry.js"></script>
<script src="src/audio.js"></script>
<script src="src/guards.js"></script>
<script src="src/player.js"></script>
<script src="src/detection.js"></script>
<script src="src/render.js"></script>
<script src="src/game.js"></script>
</body>
</html>
